apiVersion: apps/v1
kind: Deployment
metadata:
  name: ClusterGuard
  labels:
    app: ClusterGuard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ClusterGuard
  template:
    metadata:
      labels:
        app: ClusterGuard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ClusterGuard
          image: ghcr.io/RiyaJ6/ClusterGuard:latest
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: ClusterGuard-config
                  key: kafka_brokers
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: ClusterGuard-config
                  key: kafka_topic
            - name: KAFKA_GROUP
              value: ClusterGuard
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ClusterGuard-secrets
                  key: webhook_url
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
