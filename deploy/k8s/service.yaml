apiVersion: v1
kind: Service
metadata:
  name: ClusterGuard
  labels:
    app: ClusterGuard
spec:
  selector:
    app: ClusterGuard
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ClusterGuard-config
data:
  kafka_brokers: "kafka:9092"
  kafka_topic: "ops.events"
  window_size: "100"
  zscore_threshold: "3.0"
  metrics_port: "9090"
  log_level: "info"
